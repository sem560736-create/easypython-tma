<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#58cc02">
    <title>EasyPython — учи Python</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">

    <!-- ============================ MAIN MENU ============================ -->
    <section id="view-menu" class="view is-active">

        <header class="hero">
            <div class="hero-top">
                <span class="hero-logo">🐍</span>
                <span class="hero-title">EasyPython</span>
                <span class="hero-streak" id="streak-chip" title="Дней подряд">🔥 0</span>
            </div>

            <div class="level-card">
                <div class="level-row">
                    <div class="level-badge" id="level-badge">1</div>
                    <div class="level-meta">
                        <div class="level-name">Уровень <span id="level-value">1</span></div>
                        <div class="level-xp"><span id="xp-value">0</span> XP · до следующего <span id="xp-next">100</span></div>
                    </div>
                    <div class="xp-total" id="xp-total">0 XP</div>
                </div>
                <div class="xp-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="xp-bar">
                    <div class="xp-bar-fill" id="xp-bar-fill"></div>
                </div>
            </div>

            <div class="course-progress">
                <div class="course-progress-text">
                    <span>Прогресс курса</span>
                    <span><span id="done-count">0</span> / <span id="total-count">17</span> уроков</span>
                </div>
                <div class="course-bar"><div class="course-bar-fill" id="course-bar-fill"></div></div>
            </div>
        </header>

        <section class="badges-wrap">
            <h2 class="section-title">🏆 Достижения</h2>
            <div id="badges-container" class="badges"></div>
        </section>

        <section class="lessons-wrap">
            <div class="section-head">
                <h2 class="section-title">📚 Уроки</h2>
                <button class="link-btn" id="refresh-btn" type="button">Обновить</button>
            </div>
            <div id="lessons-grid" class="lessons-grid">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </section>

        <footer class="footer">EasyPython — учите Python прямо в Telegram</footer>
    </section>

    <!-- =========================== LESSON DETAIL =========================== -->
    <section id="view-lesson" class="view">
        <header class="lesson-header">
            <button class="back-btn" id="back-btn" type="button" aria-label="Назад">←</button>
            <div class="lesson-header-text">
                <div class="lesson-header-kicker" id="detail-kicker">Урок 1</div>
                <div class="lesson-header-title" id="detail-title">Загрузка…</div>
            </div>
            <div class="lesson-header-xp" id="detail-xp">+10 XP</div>
        </header>

        <div class="step-bar">
            <div class="step is-done">1<span>Теория</span></div>
            <div class="step is-current">2<span>Задание</span></div>
            <div class="step">3<span>Проверка</span></div>
        </div>

        <div class="lesson-body">
            <article class="card theory-card">
                <h3 class="card-title">📖 Теория</h3>
                <div id="detail-theory" class="theory-content"></div>
            </article>

            <article class="card exercise-card">
                <h3 class="card-title">📝 Задание</h3>
                <div id="detail-exercise" class="exercise-content"></div>
            </article>

            <details class="card hint-card" id="hint-card">
                <summary>💡 Подсказка <span class="hint-toggle">показать</span></summary>
                <div id="detail-hint" class="hint-content"></div>
            </details>

            <article class="card answer-card">
                <label class="card-title" for="answer-input">💻 Ваш код</label>
                <textarea id="answer-input" class="code-input" spellcheck="false"
                          autocapitalize="off" autocomplete="off" autocorrect="off"
                          placeholder="print('Hello, World!')"></textarea>
                <div class="answer-actions">
                    <button class="btn-check" id="check-btn" type="button">Проверить</button>
                </div>
                <div id="result-message" class="result" aria-live="polite"></div>
            </article>

            <div class="lesson-nav">
                <button class="btn-ghost" id="prev-lesson-btn" type="button">← Предыдущий</button>
                <button class="btn-primary" id="next-lesson-btn" type="button" hidden>Следующий урок →</button>
            </div>
        </div>
    </section>

</div>

<div id="toast-layer" class="toast-layer"></div>
<script src="/static/js/main.js"></script>
</body>
</html>
